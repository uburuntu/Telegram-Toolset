name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION_FILE: .nvmrc

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint
        run: npm run lint

      - name: Check i18n values
        run: npm run check:i18n

      - name: Run TypeScript check
        run: npm run type-check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit:coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-unit
          path: coverage/unit/
          retention-days: 7

  component-tests:
    name: Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:component:coverage

      - name: Upload component coverage
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-component
          path: coverage/component/
          retention-days: 7

  e2e-tests:
    name: E2E Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - project: chromium
            install_browser: chromium
          - project: firefox
            install_browser: firefox
          - project: webkit
            install_browser: webkit
          - project: mobile-chrome
            install_browser: chromium
          - project: mobile-safari
            install_browser: webkit
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.install_browser }}

      - name: Run E2E tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload test results
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, unit-tests, component-tests]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check bundle budgets
        run: npm run bundle:check

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-dist:
    name: Production Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Run production build smoke tests
        run: npm run test:e2e:dist

      - name: Upload smoke report
        uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: playwright-report-dist
          path: playwright-report-dist/
          retention-days: 7

  preview-deploy:
    name: Deploy Preview
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, unit-tests, component-tests, e2e-tests, build, smoke-dist]
    concurrency:
      group: preview-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: 'npm'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Validate Surge token
        run: test -n "${{ secrets.SURGE_TOKEN }}"

      - name: Deploy to Surge
        run: npx --no-install surge ./dist pr-${{ github.event.pull_request.number }}-telegram-toolset.surge.sh --token ${{ secrets.SURGE_TOKEN }}

      - name: Comment PR
        uses: actions/github-script@v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const url = `https://pr-${process.env.PR_NUMBER}-telegram-toolset.surge.sh`;
            const sha = process.env.HEAD_SHA.substring(0, 7);
            const fullSha = process.env.HEAD_SHA;
            const repoUrl = `https://github.com/${process.env.REPO}`;

            const body = [
              '### Preview Deployment',
              '',
              `🔗 **${url}**`,
              '',
              `Currently deployed: [\`${sha}\`](${repoUrl}/commit/${fullSha})`,
              '',
              '_Auto-updates on each push after the full CI quality gate passes._'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body.includes('Preview Deployment'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }

  deploy-pages:
    name: Deploy to GitHub Pages
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, unit-tests, component-tests, e2e-tests, build, smoke-dist]
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub concurrency queues are not strictly FIFO, so a slower older run
      # could publish after a newer commit and roll Pages back. Only deploy when
      # this run's commit is still the tip of main; the newer run will publish.
      - name: Verify this run deploys the latest commit on main
        id: freshness
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const latest = branch.commit.sha;
            const current = context.sha;
            core.info(`Latest main: ${latest}`);
            core.info(`This run:    ${current}`);
            const isLatest = latest === current;
            core.setOutput('is_latest', String(isLatest));
            if (!isLatest) {
              core.warning(
                `Skipping Pages deploy for ${current}; a newer commit (${latest}) is already on main.`,
              );
            }

      - name: Setup Pages
        if: steps.freshness.outputs.is_latest == 'true'
        uses: actions/configure-pages@v6.0.0

      - name: Download build artifact
        if: steps.freshness.outputs.is_latest == 'true'
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Upload artifact
        if: steps.freshness.outputs.is_latest == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.freshness.outputs.is_latest == 'true'
        uses: actions/deploy-pages@v5.0.0
