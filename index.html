<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Toolset</title>

    <link rel="icon" href="/favicon.png" type="image/png" />

    <!-- SEO -->
    <meta
      name="description"
      content="A growing toolbox for useful Telegram jobs the official apps do not support. Connect once and use every tool from the same private browser workspace."
    />
    <meta
      name="keywords"
      content="Telegram, MTProto, GramJS, deleted messages, scheduled messages, export, local-first, open source, privacy"
    />
    <meta name="author" content="rmbk" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Telegram Toolset" />
    <meta
      property="og:description"
      content="Useful Telegram tools, all in one place. One login, a growing toolbox, and no application backend or tracking."
    />
    <meta property="og:url" content="https://telegram-toolset.rmbk.me" />
    <meta property="og:site_name" content="Telegram Toolset" />
    <meta property="og:image" content="https://telegram-toolset.rmbk.me/social-preview.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta
      property="og:image:alt"
      content="Telegram Toolset - useful Telegram tools, all in one place"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Telegram Toolset" />
    <meta
      name="twitter:description"
      content="Useful Telegram tools, all in one place. One login, a growing toolbox, and no application backend or tracking."
    />
    <meta name="twitter:image" content="https://telegram-toolset.rmbk.me/social-preview.png" />
    <meta
      name="twitter:image:alt"
      content="Telegram Toolset - useful Telegram tools, all in one place"
    />

    <!-- SPA redirect handler for GitHub Pages -->
    <script>
      (function() {
        const redirect = sessionStorage.getItem('redirect')
        if (redirect) {
          sessionStorage.removeItem('redirect')
          history.replaceState(null, '', redirect)
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
